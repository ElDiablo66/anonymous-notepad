[package]
name = "anonymous-notepad"
version = "0.3.1"
description = "A fast text and code editor with tabs, powerful search and a neon sunset look"
authors = ["El Diablo 59"]
edition = "2021"
license = "MIT"

[lib]
name = "anonymous_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
ignore = "0.4"
memmap2 = "0.9"
memchr = "2"
trash = "5"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
