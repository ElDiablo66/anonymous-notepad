name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Anonymous Notepad version
      description: Tools, About
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: input
    id: look
    attributes:
      label: Theme and glow level
      description: Only if it's a display problem
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the file's encoding or size, what you tried
