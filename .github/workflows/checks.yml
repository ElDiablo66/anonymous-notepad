name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Type-check and build the interface
        run: npm run build
      - name: Interface tests
        run: npm test
      - name: Collect third-party notices
        run: npm run notices
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
